appId: com.chamaccounts.app
productName: Chamaccounts
copyright: Copyright © 2025

# Corps de la release GitHub (généré en CI par scripts/generate-release-notes.mjs)
releaseInfo:
  releaseNotesFile: build/release-notes.md

directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron
  - parametre
  - data-template
  - data-template-profile
  - package.json

asarUnpack:
  - parametre/**/*
  - data-template/**/*
  - data-template-profile/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD via secrets CI (scripts/ci-prepare-signing.sh)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Chamaccounts
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.finance
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation auto si APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (CI ou local)

dmg:
  # Titre sans espace : évite les collisions /Volumes sur les runners arm64 (APFS).
  title: ${productName}-${version}
  # null : saute Alias.for_file(background.tiff), cassé sur macos-latest / APFS.
  background: null
  icon: build/icon.icns
  iconSize: 80
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icons
  category: Office;Finance;
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  synopsis: Comptabilité multi-plateforme
  description: Suivi des transactions, soldes de comptes, comptabilité mensuelle et budget annuel.
  desktop:
    Name: Chamaccounts
    Comment: Comptabilité multi-plateforme
    Categories: Office;Finance;
    StartupWMClass: chamaccounts

publish:
  provider: github
  owner: charliedrumcraft
  repo: Chamaccounts
  releaseType: release
